<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Mixamo Klip Galerisi</title>
<style>
  :root { --bg: #1d1f23; --panel: #26292e; --line: #363a41; --text: #e8e6e1; --dim: #9a9ca1; --acc: #e0a64a; --sel: #3b3427; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr auto; height: 100%; }
  #view { position: relative; grid-column: 1; grid-row: 1; min-height: 0; background: #b9bcc0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #label { position: absolute; left: 12px; top: 10px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  #label .n { font-size: 20px; font-weight: 700; color: #1b1c1f; text-shadow: none; }
  #label .g { font-size: 12px; color: #33363b; text-shadow: none; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: #222; font-size: 16px; }
  #bar { grid-column: 1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  #bar .grp { display: flex; gap: 4px; align-items: center; }
  button { background: #33373e; color: var(--text); border: 1px solid #454a52; border-radius: 6px; padding: 7px 11px; font: inherit; cursor: pointer; }
  button.on { background: var(--acc); color: #1b1c1f; border-color: var(--acc); font-weight: 600; }
  button:active { transform: translateY(1px); }
  #play { min-width: 92px; }
  #slider { flex: 1 1 200px; min-width: 160px; accent-color: var(--acc); }
  #fr { color: var(--dim); min-width: 84px; font-variant-numeric: tabular-nums; }
  label.ck { display: flex; gap: 5px; align-items: center; color: var(--dim); cursor: pointer; user-select: none; }
  label.ck input { accent-color: var(--acc); }
  #side { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  #side h1 { font-size: 15px; margin: 12px 12px 4px; }
  #side .sub { color: var(--dim); font-size: 12px; margin: 0 12px 8px; }
  #search { margin: 0 12px 8px; padding: 7px 9px; border-radius: 6px; border: 1px solid #454a52; background: #1f2226; color: var(--text); font: inherit; }
  #list { overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .gh { position: sticky; top: 0; background: #2d3036; padding: 7px 12px; font-weight: 700; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; }
  .gh .c { color: var(--dim); font-weight: 400; }
  .it { padding: 6px 12px 6px 18px; cursor: pointer; border-bottom: 1px solid #2b2e33; }
  .it:hover { background: #2f3238; }
  .it.sel { background: var(--sel); color: var(--acc); font-weight: 600; }
  .it .d { color: var(--dim); font-size: 11px; }
  .empty { color: var(--dim); padding: 6px 18px; font-size: 12px; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 50vh auto 1fr; }
    #view { grid-row: 1; }
    #bar { grid-row: 2; padding: 8px; gap: 6px 8px; }
    #side { grid-column: 1; grid-row: 3; border-left: 0; border-top: 1px solid var(--line); }
    #label .n { font-size: 16px; }
    button { padding: 7px 9px; }
  }
  body.rec #side, body.rec #bar { display: none; }
  body.rec #app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  body.rec #label { left: 22px; top: 16px; }
  body.rec #label .n { font-size: 34px; }
  body.rec #label .g { font-size: 18px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="view"><div id="msg">Yükleniyor…</div><div id="label"><div class="n"></div><div class="g"></div></div></div>
  <div id="bar">
    <div class="grp"><button id="prev" title="Önceki klip (←)">◀</button><button id="play">❚❚ Durdur</button><button id="next" title="Sonraki klip (→)">▶</button></div>
    <div class="grp" id="speeds"><button data-s="0.25">0.25x</button><button data-s="0.5">0.5x</button><button data-s="1" class="on">1x</button></div>
    <input id="slider" type="range" min="0" max="1" step="1" value="0" />
    <span id="fr">kare 0 / 0</span>
    <div class="grp"><button id="side-v" class="on">Yandan bak</button><button id="front-v">Önden bak</button></div>
    <label class="ck"><input type="checkbox" id="sword" checked />Kılıç elde</label>
    <label class="ck" title="Etek, yenler ve at kuyruğu kendi kemikleriyle, yerçekimi ve bedene çarpmayla sallanır. Kapalı: eski bağlama (kıyafet bacak ve kola yapışık)."><input type="checkbox" id="kumas" checked /><span id="kumas-l">Kumaş fiziği: açık</span></label>
    <label class="ck"><input type="checkbox" id="inplace" checked />Yerinde</label>
    <label class="ck"><input type="checkbox" id="xbot" />Yanında X Bot</label>
    <label class="ck" title="Hakamanın geniş eteği bacaklara bağlı; geniş duruşta yere giriyor. Bu seçenek yalnız görüntüde yere yatırır."><input type="checkbox" id="hem" />Etek yere girmesin</label>
  </div>
  <div id="side">
    <h1>Mixamo hareketleri — Akane</h1>
    <div class="sub" id="count"></div>
    <input id="search" type="search" placeholder="Ara… (ör. kick, slash)" />
    <div id="list"></div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
