<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow" />
    <script>(function(){try{var l=location;if(!/[?&]st=/.test(l.search))history.replaceState(null,"",l.pathname+(l.search?l.search+"&":"?")+"st=0"+l.hash)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Shadow Duel 3D Strike Test</title>
<!-- 3D strike test (branch claude/sd-3d, never shipped): the same Akane strike drawn three ways, stepped from one fight.
     NOW = the game today (motion round 1), A = 2.5D on the drawn art (js/depth25.js), B = a real 3D model (three.js). -->
<style>
  :root { --bg: #0d0f14; --panel: #171a22; --ink: #e9ecf3; --dim: #9aa3b5; --acc: #e04a3c; --line: #2a2f3b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 600 14px/1.3 system-ui, "Segoe UI", Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); background: #11141b; border-bottom: 1px solid var(--line); }
  #bar h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .02em; white-space: nowrap; }
  #bar .sp { flex: 1; }
  button { font: inherit; color: var(--ink); background: #232835; border: 1px solid #343b4c; border-radius: 9px; padding: 8px 12px; min-height: 38px; cursor: pointer; touch-action: manipulation; }
  button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  button:active { transform: translateY(1px); }
  #grid { flex: 1; display: grid; gap: 6px; padding: 6px; min-height: 0; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
  @media (orientation: portrait) { #grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; } }
  #grid.solo { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #grid.solo figure:not(.big) { display: none; }
  figure { position: relative; margin: 0; background: var(--panel); border-radius: 10px; overflow: hidden; min-height: 0; min-width: 0; cursor: zoom-in; }
  #grid.solo figure { cursor: zoom-out; }
  figure canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  figcaption { position: absolute; left: 8px; top: 8px; padding: 4px 9px; border-radius: 7px; background: rgba(0,0,0,.55); font-size: 13px; pointer-events: none; }
  figcaption b { color: #fff; margin-right: 4px; }
  figcaption span { color: var(--dim); font-weight: 600; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
  #hint { padding: 4px 10px 8px; color: var(--dim); font-size: 12px; text-align: center; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #game { position: fixed; left: -2000px; top: 0; width: 640px; height: 360px; border: 0; visibility: hidden; }
</style>
</head>
<body>
<div id="bar">
  <h1>Akane · strike in 3D?</h1>
  <button id="mHeavy" class="on">Heavy</button>
  <button id="mLight">Light</button>
  <span class="sp"></span>
  <button id="replay">⟲ Replay</button>
  <button id="slow">Slow-mo</button>
</div>
<div id="grid">
  <figure id="f0"><canvas id="c0"></canvas><figcaption><b>NOW</b><span>the game today</span></figcaption></figure>
  <figure id="f1"><canvas id="c1"></canvas><figcaption><b>A</b><span>2.5D, same drawn art</span></figcaption></figure>
  <figure id="f2"><canvas id="c2"></canvas><figcaption><b>B</b><span>real 3D model</span></figcaption><div id="msg">Loading 3D…</div></figure>
</div>
<div id="hint">Tap a picture to see it big. Same fight, same timing in all three.</div>
<iframe id="game" title="game" tabindex="-1" aria-hidden="true"></iframe>
<script type="module" src="./uc-boyut-test/page.js"></script>
</body>
</html>
