<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow" />
    <script>(function(){try{var l=location;if(!/[?&]st=/.test(l.search))history.replaceState(null,"",l.pathname+(l.search?l.search+"&":"?")+"st=0"+l.hash)}catch(e){}})();</script>
    <meta name="robots" content="noindex, nofollow" />
    <script>(function(){try{var l=location,q=l.search,a=["st=0"].filter(function(x){return !new RegExp("[?&]"+x.split("=")[0]+"=").test(q)});if(a.length)history.replaceState(null,"",l.pathname+(q?q+"&":"?")+a.join("&")+l.hash)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Shadow Duel Mocap Test</title>
<!-- Motion-capture retarget test (branch claude/sd-mocap, never shipped): the same action drawn two ways, side by side.
     NOW = the duel prototype's hand-keyed move (js/duel*.js, drawn through depth25), MOCAP = recorded human motion
     (Mixamo clips processed into our own skeleton data, mocap/*.json) played on the same drawn fighter (js/mocap.js). -->
<style>
  :root { --bg: #0d0f14; --panel: #171a22; --ink: #e9ecf3; --dim: #9aa3b5; --acc: #e04a3c; --line: #2a2f3b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 600 14px/1.3 system-ui, "Segoe UI", Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #bar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top)); background: #11141b; border-bottom: 1px solid var(--line); }
  #bar h1 { font-size: 15px; margin: 0 6px 0 0; letter-spacing: .02em; white-space: nowrap; }
  #clips { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 8px; background: #0f1218; border-bottom: 1px solid var(--line); }
  #bar .sp { flex: 1; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: #232835; border: 1px solid #343b4c; border-radius: 9px; padding: 7px 10px; min-height: 36px; cursor: pointer; touch-action: manipulation; }
  button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  button:active { transform: translateY(1px); }
  #grid { flex: 1; display: grid; gap: 6px; padding: 6px; min-height: 0; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  @media (orientation: portrait) { #grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  #grid.solo { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #grid.solo figure:not(.big) { display: none; }
  figure { position: relative; margin: 0; background: var(--panel); border-radius: 10px; overflow: hidden; min-height: 0; min-width: 0; cursor: zoom-in; }
  #grid.solo figure { cursor: zoom-out; }
  figure canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  figcaption { position: absolute; left: 8px; top: 8px; padding: 4px 9px; border-radius: 7px; background: rgba(0,0,0,.55); font-size: 13px; pointer-events: none; }
  figcaption b { color: #fff; margin-right: 4px; }
  figcaption span { color: var(--dim); font-weight: 600; }
  .note { position: absolute; left: 8px; bottom: 8px; right: 8px; color: var(--dim); font-size: 11px; font-weight: 500; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
  #hint { padding: 4px 10px 8px; color: var(--dim); font-size: 12px; text-align: center; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #game { position: fixed; left: -2000px; top: 0; width: 640px; height: 360px; border: 0; visibility: hidden; }
</style>
</head>
<body>
<div id="bar">
  <h1 id="title">Mocap test</h1>
  <button id="who">Akane</button>
  <span class="sp"></span>
  <button id="side" class="on">Side by side</button>
  <button id="replay">⟲ Replay</button>
  <button id="slow">Slow-mo</button>
</div>
<div id="clips"></div>
<div id="grid">
  <figure id="f0"><canvas id="c0"></canvas><figcaption><b>NOW</b><span>hand-keyed (duel prototype)</span></figcaption><div class="note" id="n0"></div></figure>
  <figure id="f1"><canvas id="c1"></canvas><figcaption><b>MOCAP</b><span>recorded human motion</span></figcaption><div class="note" id="n1"></div><div id="msg">Loading…</div></figure>
</div>
<div id="hint">Tap a picture to see it big. Same drawn fighter in both: NOW is today's hand-keyed move, MOCAP is real recorded human motion.</div>
<iframe id="game" title="game" tabindex="-1" aria-hidden="true"></iframe>
<script type="module" src="./mocap-test/page.js"></script>
</body>
</html>
